<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 480" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="hero_nav_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F2236;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#17324D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0B1A2A;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="gold_glow" cx="85%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#E8A317;stop-opacity:0.25" />
      <stop offset="50%" style="stop-color:#E8A317;stop-opacity:0.05" />
      <stop offset="100%" style="stop-color:#17324D;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="blue_glow" cx="15%" cy="80%" r="50%">
      <stop offset="0%" style="stop-color:#3A6B9B;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#17324D;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <rect width="1440" height="480" fill="url(#hero_nav_grad)" />
  <rect width="1440" height="480" fill="url(#gold_glow)" />
  <rect width="1440" height="480" fill="url(#blue_glow)" />
  
  <!-- Subtle Bookstore Shelf Silhouettes & Archways -->
  <g opacity="0.08" stroke="#E8A317" stroke-width="1.5" fill="none">
    <path d="M50,480 L50,150 Q150,50 250,150 L250,480" />
    <path d="M280,480 L280,180 Q360,100 440,180 L440,480" />
    <path d="M1000,480 L1000,180 Q1080,100 1160,180 L1160,480" />
    <path d="M1190,480 L1190,150 Q1290,50 1390,150 L1390,480" />
    <line x1="0" y1="280" x2="1440" y2="280" />
    <line x1="0" y1="380" x2="1440" y2="380" />
  </g>
  
  <!-- Ambient floating particles & stars -->
  <circle cx="200" cy="100" r="3" fill="#E8A317" opacity="0.6" />
  <circle cx="340" cy="70" r="2" fill="#FFFFFF" opacity="0.5" />
  <circle cx="850" cy="120" r="3" fill="#E8A317" opacity="0.7" />
  <circle cx="1120" cy="80" r="2.5" fill="#E8A317" opacity="0.8" />
