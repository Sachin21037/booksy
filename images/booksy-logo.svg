<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="starGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDF00" />
      <stop offset="50%" stop-color="#E8A317" />
      <stop offset="100%" stop-color="#C67D0A" />
    </linearGradient>
    
    <radialGradient id="sunburst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFEBAA" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#FCD34D" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#E8A317" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="leftWingGrad" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#006666" />
      <stop offset="40%" stop-color="#008080" />
      <stop offset="80%" stop-color="#00A896" />
      <stop offset="100%" stop-color="#02C39A" />
    </linearGradient>

    <linearGradient id="rightWingGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#006666" />
      <stop offset="40%" stop-color="#008080" />
      <stop offset="80%" stop-color="#00A896" />
      <stop offset="100%" stop-color="#02C39A" />
    </linearGradient>

    <linearGradient id="bookCoverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B3B5F" />
      <stop offset="100%" stop-color="#0E1E32" />
    </linearGradient>

    <linearGradient id="featherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A896" />
      <stop offset="100%" stop-color="#17324D" />
    </linearGradient>

    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(0, -10)">
    <!-- Star Glow & Aura -->
    <circle cx="250" cy="140" r="55" fill="url(#sunburst)" opacity="0.85" />
    
    <!-- Sparkle Arc Dots -->
    <g fill="#D4920F" opacity="0.75">
      <circle cx="180" cy="155" r="2.5" />
      <circle cx="205" cy="120" r="3.5" />
      <circle cx="295" cy="120" r="3.5" />
      <circle cx="320" cy="155" r="2.5" />
      <circle cx="250" cy="92" r="3.5" />
    </g>

    <!-- Star (8-pointed) -->
    <g transform="translate(250, 140)">
      <!-- Main Star Points -->
      <polygon points="0,-32 7,-8 32,0 7,8 0,32 -7,8 -32,0 -7,-8" fill="url(#starGlow)" filter="url(#glowEffect)" />
      <!-- Diagonal Smaller Points -->
      <polygon points="0,-18 5,-5 18,0 5,5 0,18 -5,5 -18,0 -5,-5" fill="#FFF275" transform="rotate(45)" opacity="0.95" />
      <circle cx="0" cy="0" r="3" fill="#FFFFFF" />
    </g>

    <!-- LEFT WING -->
    <g>
      <!-- Wing main body & feathers -->
      <path d="M 190 200 C 160 160 110 100 80 95 C 75 115 85 145 105 165 C 80 145 80 170 95 195 C 110 215 135 235 165 245 C 150 220 140 185 170 175 C 145 190 145 220 170 235 Z" fill="url(#leftWingGrad)" />
      <path d="M 80 95 C 115 110 145 150 165 195 C 150 170 135 150 105 135 C 92 128 82 110 80 95 Z" fill="#00C49F" opacity="0.6" />
      <path d="M 95 195 C 120 190 145 205 175 240 C 155 235 130 225 110 210 Z" fill="#004D4D" opacity="0.5" />
      <!-- Extra Wing Feathers -->
      <path d="M 120 225 C 90 190 95 160 85 140 C 100 155 115 185 135 210 Z" fill="#00A896" />
    </g>

    <!-- RIGHT WING -->
    <g>
      <path d="M 310 200 C 340 160 390 100 420 95 C 425 115 415 145 395 165 C 420 145 420 170 405 195 C 390 215 365 235 335 245 C 350 220 360 185 330 175 C 355 190 355 220 330 235 Z" fill="url(#rightWingGrad)" />
      <path d="M 420 95 C 385 110 355 150 335 195 C 350 170 365 150 395 135 C 408 128 418 110 420 95 Z" fill="#00C49F" opacity="0.6" />
      <path d="M 405 195 C 380 190 355 205 325 240 C 345 235 370 225 390 210 Z" fill="#004D4D" opacity="0.5" />
      <!-- Extra Wing Feathers -->
      <path d="M 380 225 C 410 190 405 160 415 140 C 400 155 385 185 365 210 Z" fill="#00A896" />
    </g>

    <!-- OPEN BOOK (Navy & Pages) -->
    <!-- Book Outer Border / Outline -->
    <path d="M 250 295 L 140 310 C 135 305 130 260 160 190 C 190 185 230 195 250 215 C 270 195 310 185 340 190 C 370 260 365 305 360 310 Z" fill="#0D1E30" stroke="#0D1E30" stroke-width="6" stroke-linejoin="round" />

    <!-- Left Book Page Block -->
    <path d="M 246 215 C 225 198 185 190 160 195 C 135 255 140 295 146 300 C 175 292 215 285 246 295 Z" fill="#17324D" />
    <!-- Right Book Page Block -->
    <path d="M 254 215 C 275 198 315 190 340 195 C 365 255 360 295 354 300 C 325 292 285 285 254 295 Z" fill="#17324D" />

    <!-- Page Layers (White edges) -->
    <path d="M 148 296 C 178 288 218 282 246 290 L 246 293 C 218 285 178 291 146 300 Z" fill="#FFFFFF" />
    <path d="M 152 291 C 180 284 218 279 246 286 L 246 288 C 218 281 180 286 150 294 Z" fill="#E2E8F0" />
    
    <path d="M 352 296 C 322 288 282 282 254 290 L 254 293 C 282 285 322 291 354 300 Z" fill="#FFFFFF" />
    <path d="M 348 291 C 320 284 282 279 254 286 L 254 288 C 282 281 320 286 350 294 Z" fill="#E2E8F0" />

    <!-- Page Text Lines on Left -->
    <g stroke="#3A5A7C" stroke-width="2.5" stroke-linecap="round" opacity="0.85">
      <line x1="175" y1="215" x2="232" y2="225" />
      <line x1="170" y1="228" x2="234" y2="238" />
      <line x1="166" y1="241" x2="236" y2="251" />
      <line x1="162" y1="254" x2="238" y2="264" />
      <line x1="158" y1="267" x2="240" y2="277" />
    </g>

    <!-- Page Text Lines on Right -->
    <g stroke="#3A5A7C" stroke-width="2.5" stroke-linecap="round" opacity="0.85">
      <line x1="268" y1="225" x2="325" y2="215" />
      <line x1="266" y1="238" x2="330" y2="228" />
      <line x1="264" y1="251" x2="334" y2="241" />
      <line x1="262" y1="264" x2="338" y2="254" />
      <line x1="260" y1="277" x2="342" y2="267" />
    </g>

    <!-- Center Spine & Golden Quill Crest Base -->
    <path d="M 250 215 L 250 315" stroke="#0D1E30" stroke-width="3" />
    <path d="M 235 298 C 235 315 265 315 265 298 C 255 303 245 303 235 298 Z" fill="#0D1E30" />
    <!-- Quill Tip on Spine -->
    <path d="M 250 302 Q 252 308 255 310 Q 250 312 248 316 Q 248 310 250 302 Z" fill="#E8A317" />
  </g>

  <!-- TYPOGRAPHY: BOOKSY -->
  <g transform="translate(0, 375)">
    <!-- Main "BOOKSY" with Quill 'Y' -->
    <text x="238" y="0" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, 'Segoe UI', sans-serif" font-size="64" font-weight="900" fill="#17324D" text-anchor="middle" letter-spacing="4">
      BOOKS<tspan dx="2">Y</tspan>
    </text>

    <!-- Custom Stylized Feather Wing on 'Y' -->
    <path d="M 368 -32 C 378 -46 395 -58 408 -62 C 402 -48 392 -36 376 -26 C 388 -28 396 -20 398 -12 C 386 -14 374 -20 368 -24 Z" fill="url(#featherGrad)" />

    <!-- Subtitle: FINDING NEW HOMES FOR BOOKS -->
    <text x="250" y="32" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, 'Segoe UI', sans-serif" font-size="14.5" font-weight="800" fill="#00A896" text-anchor="middle" letter-spacing="4.5">
      FINDING NEW HOMES FOR BOOKS
    </text>
  </g>
</svg>
